const clk=new THREE.Clock();build();

startup();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;

 const f=(keys.up?1:0)-(keys.dn?.6:0),tr=(keys.l?1:0)-(keys.r?1:0),fx=Math.sin(heading),fz=Math.cos(heading);

  if(Math.hypot(P.x-(N-2)*C,P.z-(N-2)*C)<2.2)win();else monTick(dt,t);hud()}
 if(f&&!lock&&!fall)ph+=dt*9*Math.sign(f);const sw=(f&&!fall)?Math.sin(ph):0;
 aL.rotation.x=sw*.9;lL.rotation.x=sw*.9;lR.rotation.x=-sw*.9;
 if(fall&&!paused){fall.t+=dt;pit.scale.setScalar(Math.min(1,fall.t*3));if(fall.t>.45){const q=fall.t-.45;P.y=-q*q*30;hero.rotation.x+=dt*5;hero.rotation.z+=dt*3}
  if(fall.t>1.5){world.remove(pit);fall=null;hero.rotation.x=hero.rotation.z=0;lost();lock=0}}
 hero.position.set(P.x,P.y+(Math.abs(sw)*.14),P.z);hero.rotation.y=heading;
 torch.intensity=2.6+Math.sin(t*23)*.3+Math.random()*.5;flame.scale.setScalar(.9+Math.random()*.4);
 gates.forEach(g=>g.material.emissiveIntensity=.6+.4*Math.sin(t*3));
 for(let i=opening.length-1;i>=0;i--){const o=opening[i];o.t+=dt;o.g.scale.y=Math.max(.01,1-o.t*1.6);o.g.position.y=H/2*o.g.scale.y;o.g.material.emissiveIntensity=3;o.g.material.opacity=1-o.t;if(o.t>.8){world.remove(o.g);opening.splice(i,1)}}
 orbs.forEach((o,i)=>{o.position.y=1.3+Math.sin(t*2+i)*.25;o.rotation.y=t});
 if(world.ex)world.ex.ring.rotation.y=t*2,world.ex.ring.rotation.x=Math.sin(t)*.5;dust.rotation.y=t*.01;
 // chase camera with wall avoidance
 let k=1;for(;k>.2;k-=.1){if(!solid(ci(P.x-fx*3.2*k),ci(P.z-fz*3.2*k)))break}
 const tx=P.x-fx*3.2*k,tz=P.z-fz*3.2*k,ty=2.7+(k<1?-.5*(1-k):0);cam.position.lerp(new THREE.Vector3(tx,ty,tz),.2);
 if(fall&&fall.t>.45)cam.position.add(new THREE.Vector3((Math.random()-.5)*.25,(Math.random()-.5)*.25,0));
 cam.lookAt(P.x+fx*3,1.7+Math.max(P.y,-3)*.5,P.z+fz*3);R.render(scene,cam)})();
